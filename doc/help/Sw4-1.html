<h3 class="pHeading2"><span id="NMG2_REF_3258_1051218"></span><span id="Sw4-1"></span><span id="NMG2_REF_3258_1068478"></span>Sw4-1</h3>
<p class="pBody">The 4-1Switch has four inputs with an attenuator each, one output and four Channel Select radio buttons which can also be labelled. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a>.</p>
