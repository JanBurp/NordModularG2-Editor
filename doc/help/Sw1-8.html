<h3 class="pHeading2"><span id="NMG2_REF_3258_1051253"></span><span id="Sw1-8"></span><span id="NMG2_REF_3258_1068483"></span>Sw1-8</h3>
<p class="pBody">The 1-8Switch has one input, eight outputs and eight Channel Select radio buttons which can also be labelled. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a></p>
