<h3 class="pHeading2"><span id="NMG2_REF_3258_1051225"></span><span id="Sw8-1"></span><span id="NMG2_REF_3258_1068479"></span>Sw8-1</h3>
<p class="pBody">The 8-1Switch has eight inputs with an attenuator each, one output and eight Channel Select radio buttons which can also be labelled. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a></p>
