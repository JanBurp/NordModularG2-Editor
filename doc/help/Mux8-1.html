<h3 class="pHeading2"><span id="NMG2_REF_3258_1044844"></span><span id="Mux8-1"></span><span id="NMG2_REF_3258_1068487"></span>Mux8-1</h3>
<p class="pBody">The 8-1Multiplexer has eight inputs and one output. The channels are enabled by sending a control signal on the Ctrl input. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a>.</p>
