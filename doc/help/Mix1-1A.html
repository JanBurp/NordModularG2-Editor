<h3 class="pHeading2"><span id="NMG2_REF_3258_1050419"></span><span id="Mix1-1A"></span><span id="NMG2_REF_3258_1068456"></span>Mix1-1A</h3>
<p class="pBody">This mixer has one <span class="cfet_bokst_ver">Dynamic Control/Audio</span> signal input, a chain input and one output. The mixer has a Channel Mute button for enabling/disabling the input. The Channel Mute button can be labelled. See also <a class="link_Cross_Reference" data-help="common_mixer_parameters" data-anchor="NMG2_REF_3258_34913">Common Mixer parameters</a>.</p>
