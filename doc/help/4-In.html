<h3 class="pHeading2"><span id="NMG2_REF_3258_1038616"></span><span id="4-In"></span><span id="NMG2_REF_3258_1068336"></span>4-In</h3>
<p class="pBody">This module is used to route individual signals from the Audio Ins or the audio Buses.</p>
<p class="pFet_ord">Source selector buttons</p>
<p class="pBody">Here you select the signal source: Audio In channels 1-4 or audio Bus channels 1-4. See also <a class="link_Cross_Reference" data-help="common_in_out_module_parameters_and_definitions" data-anchor="NMG2_REF_3258_14274">Common In/Out module parameters and definitions</a>.</p>
