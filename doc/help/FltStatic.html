<h3 class="pHeading2"><span id="NMG2_REF_3258_1057600"></span><span id="FltStatic"></span><span id="NMG2_REF_3258_1068445"></span>FltStatic</h3>
<p class="pBody">This is a static filter with selectable modes (LP/BP/HP), frequency and resonance controls. The slope is fixed at 12 dB/octave. See also <a class="link_Cross_Reference" data-help="common_filter_parameters" data-anchor="NMG2_REF_3258_13327">Common Filter parameters</a>.</p>
