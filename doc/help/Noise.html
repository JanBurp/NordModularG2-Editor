<h3 class="pHeading2"><span id="NMG2_REF_3258_1053858"></span><span id="Noise"></span><span id="NMG2_REF_3258_1068378"></span>Noise</h3>
<p class="pBody">This module produces a noise signal, the noise timbre is selectable from white (very bright) to colored (low rumble).</p>
<p class="pFet_ord">White/Colored</p>
<p class="pBody">Set the color of the noise with the control knob. Colored noise contains less high frequency energy than white noise. See also <a class="link_Cross_Reference" data-help="common_oscillator_parameters" data-anchor="NMG2_REF_3258_14782">Common Oscillator parameters</a>.</p>
