<h3 class="pHeading2"><span id="NMG2_REF_3258_1053379"></span><span id="NMG2_REF_3258_21250"></span><span id="EnvAHD"></span><span id="NMG2_REF_3258_1068425"></span>EnvAHD</h3>
<p class="pBody">The Attack-Hold-Decay envelope is an envelope with three stages: Attack, Hold and Release. The AHD Envelope is well suited for audio gating applications, for example. See also <a class="link_Cross_Reference" data-help="common_envelope_generator_parameters" data-anchor="NMG2_REF_3258_14166">Common Envelope Generator parameters</a>.</p>
