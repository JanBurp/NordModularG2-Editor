<h3 class="pHeading2"><span id="NMG2_REF_3258_1046230"></span><span id="LevAmp"></span><span id="NMG2_REF_3258_1068499"></span>LevAmp</h3>
<p class="pBody">This module can amplify or attenuate a signal.</p>
<p class="pFet_ord">Amplification knob</p>
<p class="pBody">Select the desired amplification/attenuation with the knob. Any value above 1.0 amplifies the signal, any value below attenuates it. Range: 0.25 to 4.0 times the input level. See also <a class="link_Cross_Reference" data-help="common_level_module_parameters" data-anchor="NMG2_REF_3258_21841">Common Level module parameters</a>.</p>
