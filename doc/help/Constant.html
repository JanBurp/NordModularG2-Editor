<h3 class="pHeading2"><span id="NMG2_REF_3258_1045000"></span><span id="Constant"></span><span id="NMG2_REF_3258_1068494"></span>Constant</h3>
<p class="pBody">The Constant Value module produces a constant control signal that can be instantly set by the knob. Basically this module is a <span class="c_Override" style="font-style:italic">general purpose knob module</span> producing a control value that can be routed to any modulation input of another module. See also <a class="link_Cross_Reference" data-help="common_level_module_parameters" data-anchor="NMG2_REF_3258_21841">Common Level module parameters</a>. </p>
