<h3 class="pHeading2"><span id="NMG2_REF_3258_1050987"></span><span id="LevAdd"></span><span id="NMG2_REF_3258_1068497"></span>LevAdd</h3>
<p class="pBody">The LevAdd module can be used to add or subtract an offset (bias) to a signal. See also <a class="link_Cross_Reference" data-help="common_level_module_parameters" data-anchor="NMG2_REF_3258_21841">Common Level module parameters</a>.</p>
