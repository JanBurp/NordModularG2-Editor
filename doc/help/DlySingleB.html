<h3 class="pHeading2"><span id="NMG2_REF_3258_1051859"></span><span id="DlySingleB"></span><span id="NMG2_REF_3258_1068545"></span>DlySingleB</h3>
<p class="pBody">A single delay with selectable time control. The delay time can also be modulated from an external source. See also <a class="link_Cross_Reference" data-help="common_delay_group_parameters" data-anchor="NMG2_REF_3258_25068">Common Delay group parameters</a>.</p>
