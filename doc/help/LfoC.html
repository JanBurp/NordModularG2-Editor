<h3 class="pHeading2"><span id="NMG2_REF_3258_1052463"></span><span id="LfoC"></span><span id="NMG2_REF_3258_1068388"></span>LfoC</h3>
<p class="pBody">This LFO produces one of six selectable waveforms. The rate of the LFO can be modulated. LfoE has the same wave shapes as LfoA but uses less Patch Load because of the drop-down waveform selector. See also <a class="link_Cross_Reference" data-help="common_lfo_parameters" data-anchor="NMG2_REF_3258_25811">Common LFO parameters</a>.</p>
