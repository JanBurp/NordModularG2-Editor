<h3 class="pHeading2"><span id="NMG2_REF_3258_1050453"></span><span id="Mix8-1A"></span><span id="NMG2_REF_3258_1068464"></span>Mix8-1A</h3>
<p class="pBody">This mixer has eight <span class="cfet_bokst_ver">Dynamic Control/Audio</span> signal inputs and one output.</p>
<p class="pFet_ord">Pad scroll button</p>
<p class="pBody">Click to select 0, -6 or -12 dB attenuation on all input channels. See also <a class="link_Cross_Reference" data-help="common_mixer_parameters" data-anchor="NMG2_REF_3258_34913">Common Mixer parameters</a>.</p>
