<h3 class="pHeading2"><span id="NMG2_REF_3258_1051889"></span><span id="DelayQuad"></span><span id="NMG2_REF_3258_1068547"></span>DelayQuad</h3>
<p class="pBody">A 4-tap delay with selectable time controls for each tap. The individual delay times can also be modulated from external sources. There is also an additional fifth output with a fixed delay time at the currently selected Range. See also <a class="link_Cross_Reference" data-help="common_delay_group_parameters" data-anchor="NMG2_REF_3258_25068">Common Delay group parameters</a>.</p>
