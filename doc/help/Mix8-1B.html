<h3 class="pHeading2"><span id="NMG2_REF_3258_1043466"></span><span id="Mix8-1B"></span><span id="NMG2_REF_3258_1068465"></span>Mix8-1B</h3>
<p class="pBody">This mixer has eight <span class="cfet_bokst_ver">Dynamic Control/Audio</span> signal inputs, one Chain input and one output. Each input is equipped with a separate attenuation control. The mixer also has a -6 dB button for attenuating all inputs by another -6 dB. See also <a class="link_Cross_Reference" data-help="common_mixer_parameters" data-anchor="NMG2_REF_3258_34913">Common Mixer parameters</a>.</p>
