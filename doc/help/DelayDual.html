<h3 class="pHeading2"><span id="NMG2_REF_3258_1051872"></span><span id="DelayDual"></span><span id="NMG2_REF_3258_1068546"></span>DelayDual</h3>
<p class="pBody">A 2-tap delay with selectable time controls for each tap. The individual delay times can also be modulated from external sources. See also <a class="link_Cross_Reference" data-help="common_delay_group_parameters" data-anchor="NMG2_REF_3258_25068">Common Delay group parameters</a>.</p>
