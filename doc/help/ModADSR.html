<h3 class="pHeading2"><span id="NMG2_REF_3258_1053443"></span><span id="ModADSR"></span><span id="NMG2_REF_3258_1068429"></span>ModADSR</h3>
<p class="pBody">The Mod Envelope is an ADSR envelope with control signal inputs for modulating Attack, Decay, Sustain and Release from external sources. The Shape characteristics of this envelope is fixed to Linear Attack & Exponential Decay/Release. See also <a class="link_Cross_Reference" data-help="common_envelope_generator_parameters" data-anchor="NMG2_REF_3258_14166">Common Envelope Generator parameters</a>.</p>
