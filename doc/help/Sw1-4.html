<h3 class="pHeading2"><span id="NMG2_REF_3258_1051246"></span><span id="Sw1-4"></span><span id="NMG2_REF_3258_1068482"></span>Sw1-4</h3>
<p class="pBody">The 1-4Switch has one input with an attenuator, four outputs and four Channel Select radio buttons which can also be labelled. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a></p>
