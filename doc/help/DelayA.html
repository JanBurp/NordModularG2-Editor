<h3 class="pHeading2"><span id="NMG2_REF_3258_1051944"></span><span id="DelayA"></span><span id="NMG2_REF_3258_1068551"></span>DelayA</h3>
<p class="pBody">This is a single channel audio delay with Feedback and Filter controls. You can also set the mix between delayed signal and input signal with the Dry/Wet knob. See also <a class="link_Cross_Reference" data-help="common_delay_group_parameters" data-anchor="NMG2_REF_3258_25068">Common Delay group parameters</a>.</p>
