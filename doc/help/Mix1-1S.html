<h3 class="pHeading2"><span id="NMG2_REF_3258_1050473"></span><span id="Mix1-1S"></span><span id="NMG2_REF_3258_1068457"></span>Mix1-1S</h3>
<p class="pBody">This mixer has stereo <span class="cfet_bokst_ver">Dynamic Control/Audio</span> signal inputs, stereo chain inputs and stereo outputs. The mixer has a Channel Mute button for enabling/disabling the inputs. The Channel Mute button can be labelled. See also <a class="link_Cross_Reference" data-help="common_mixer_parameters" data-anchor="NMG2_REF_3258_34913">Common Mixer parameters</a>.</p>
