<h3 class="pHeading2"><span id="NMG2_REF_3258_1044384"></span><span id="ValSw2-1"></span><span id="NMG2_REF_3258_1068484"></span>ValSw2-1</h3>
<p class="pBody">The 2-1 Value Switch switches between two inputs at a definable Control signal input value. </p>
<p class="pFet_ord">Ctrl Value arrow buttons</p>
<p class="pBody">Set the lower limit where the switch should change to the On input channel. Range: 0-64 units in steps of 1 unit. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a>.</p>
