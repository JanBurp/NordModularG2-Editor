<h3 class="pHeading2"><span id="NMG2_REF_3258_1044874"></span><span id="Mux1-8"></span><span id="NMG2_REF_3258_1068488"></span>Mux1-8</h3>
<p class="pBody">The 1-8Multiplexer has one input and eight outputs. The channels are enabled by sending a control signal on the Ctrl input. See also <a class="link_Cross_Reference" data-help="common_switch_parameters" data-anchor="NMG2_REF_3258_14781">Common Switch parameters</a></p>
