<h3 class="pHeading2"><span id="NMG2_REF_3258_1021486"></span><span id="OscA"></span><span id="NMG2_REF_3258_1068357"></span>OscA</h3>
<p class="pBody">This oscillator can produce one of six waveforms: Sine, Triangle, Sawtooth, Square, 25% Pulse or 10% Pulse. The oscillator has two pitch modulation inputs. See also <a class="link_Cross_Reference" data-help="common_oscillator_parameters" data-anchor="NMG2_REF_3258_14782">Common Oscillator parameters</a>.</p>
