<h3 class="pHeading2"><span id="NMG2_REF_3258_1054113"></span><span id="Mix2-1A"></span><span id="NMG2_REF_3258_1068458"></span>Mix2-1A</h3>
<p class="pBody">This mixer has two <span class="cfet_bokst_ver">Dynamic Control/Audio</span> signal inputs and one output. Each input is equipped with a separate attenuation control. The mixer has a Channel Mute button per channel for enabling/disabling the inputs. TheChannel Mute buttons can be labelled. See also <a class="link_Cross_Reference" data-help="common_mixer_parameters" data-anchor="NMG2_REF_3258_34913">Common Mixer parameters</a>.</p>
