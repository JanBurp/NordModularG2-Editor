<h3 class="pHeading2"><span id="NMG2_REF_3258_1053326"></span><span id="EnvADSR"></span><span id="NMG2_REF_3258_1068421"></span>EnvADSR</h3>
<p class="pBody">This is a regular four-stage ADSR (Attack, Decay, Sustain and Release) envelope. The ADSR Envelope is well suited for controlling audio signal amplitude, pitch and filter cut-off frequency, for example. See also <a class="link_Cross_Reference" data-help="common_envelope_generator_parameters" data-anchor="NMG2_REF_3258_14166">Common Envelope Generator parameters</a>.</p>
