<h3 class="pHeading2"><span id="NMG2_REF_3258_1062011"></span><span id="RndClkA"></span><span id="NMG2_REF_3258_1068415"></span>RndClkA</h3>
<p class="pBody">The clocked random step module produces a new random value each time it receives a trigger pulse on its Clk input. Use the Dice button to 'randomize' the module manually, instead of using the Clk input.</p>
