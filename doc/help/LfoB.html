<h3 class="pHeading2"><span id="NMG2_REF_3258_1021686"></span><span id="LfoB"></span><span id="NMG2_REF_3258_1068387"></span>LfoB</h3>
<p class="pBody">LFO B generates one of four different control signals. The phase of the signal can be controlled and modulated. The rate of the LFO can be modulated by a modulation source and the keyboard. The wave cycle can also be forced to restart via the Rst input. See also <a class="link_Cross_Reference" data-help="common_lfo_parameters" data-anchor="NMG2_REF_3258_25811">Common LFO parameters</a>.</p>
