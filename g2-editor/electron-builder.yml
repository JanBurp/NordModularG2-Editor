appId: com.nord.g2-editor
productName: G2 Editor
icon: resources/jack_icon.png
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*

mac:
  target:
    - dmg
  category: public.app-category.music
  extraResources:
    - from: resources/g2-cli
      to: g2-cli

win:
  target:
    - nsis
  extraResources:
    - from: resources/g2-cli.exe
      to: g2-cli.exe

linux:
  target:
    - dir
