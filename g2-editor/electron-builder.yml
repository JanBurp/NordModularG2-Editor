appId: com.nord.g2-editor
productName: G2 Editor
icon: resources/icon.png
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*

afterPack: ./scripts/after-pack.js

extraResources:
  - from: ../doc/help
    to: doc/help
  - from: ../designs/mini-modules
    to: designs/mini-modules
  - from: resources/patches
    to: patches

fileAssociations:
  - ext: pch2
    name: Nord G2 Patch
    description: Nord Modular G2 Patch
    role: Editor
  - ext: prf2
    name: Nord G2 Performance
    description: Nord Modular G2 Performance
    role: Editor

mac:
  artifactName: "G2-Editor-${arch}.${ext}"
  target:
    - dmg
  category: public.app-category.music
  electronLanguages:
    - en
    - nl
  extraResources:
    - from: resources/g2-cli
      to: g2-cli
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.nord.g2.patch
        UTTypeDescription: Nord Modular G2 Patch
        UTTypeConformsTo: [public.data]
        UTTypeTagSpecification:
          public.filename-extension: [pch2]
      - UTTypeIdentifier: com.nord.g2.performance
        UTTypeDescription: Nord Modular G2 Performance
        UTTypeConformsTo: [public.data]
        UTTypeTagSpecification:
          public.filename-extension: [prf2]

dmg:
  window: { width: 540, height: 440 }
  contents:
    - { x: 130, y: 190 }
    - { x: 410, y: 190, type: link, path: /Applications }
    - { x: 270, y: 330, type: file, path: install/README-macOS.txt, name: README.txt }

win:
  artifactName: "G2-Editor-Setup.${ext}"
  target:
    - nsis
  extraResources:
    - from: resources/g2-cli.exe
      to: g2-cli.exe

nsis:
  license: install/README-Windows.txt

linux:
  target:
    - dir
