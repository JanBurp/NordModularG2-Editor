appId: com.nord.g2-editor
productName: G2 Editor
icon: resources/icon.png
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
  - "!resources/UsbDk_x64.msi"

afterPack: ./scripts/after-pack.js

extraResources:
  - from: ../doc/help
    to: doc/help
  - from: ../designs/mini-modules
    to: designs/mini-modules
  - from: resources/patches
    to: patches

fileAssociations:
  - ext: pch2
    name: Nord G2 Patch
    description: Nord Modular G2 Patch
    role: Editor
  - ext: prf2
    name: Nord G2 Performance
    description: Nord Modular G2 Performance
    role: Editor

mac:
  artifactName: "G2-Editor-${arch}.${ext}"
  target:
    - dmg
  category: public.app-category.music
  electronLanguages:
    - en
    - nl
  extraResources:
    - from: resources/g2-cli
      to: g2-cli
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.nord.g2.patch
        UTTypeDescription: Nord Modular G2 Patch
        UTTypeConformsTo: [public.data]
        UTTypeTagSpecification:
          public.filename-extension: [pch2]
      - UTTypeIdentifier: com.nord.g2.performance
        UTTypeDescription: Nord Modular G2 Performance
        UTTypeConformsTo: [public.data]
        UTTypeTagSpecification:
          public.filename-extension: [prf2]

win:
  artifactName: "G2-Editor-Setup.${ext}"
  target:
    - nsis
  extraResources:
    - from: resources/g2-cli.exe
      to: g2-cli.exe
    # Downloaded by scripts/fetch-usbdk.js
    - from: resources/UsbDk_x64.msi
      to: UsbDk_x64.msi

nsis:
  include: resources/windows/installer.nsh

linux:
  artifactName: "G2-Editor-linux-${arch}.${ext}"
  target:
    - AppImage
    - deb
  category: Audio
  # A directory of NxN.png files: from the single resources/icon.png electron-builder can't read
  # the size and installs it under hicolor/0x0, which desktop menus don't pick up.
  icon: resources/linux/icons
  maintainer: "Jan den Besten <info@jandenbesten.net>"
  extraResources:
    - from: resources/g2-cli
      to: g2-cli
    - from: resources/linux/70-nord-g2.rules
      to: 70-nord-g2.rules

deb:
  afterInstall: resources/linux/after-install.sh
  afterRemove: resources/linux/after-remove.sh
