appId: com.nord.g2-editor
productName: G2 Editor
icon: resources/icon.png
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*

extraResources:
  - from: ../doc/help
    to: doc/help

mac:
  artifactName: "G2-Editor-${arch}.${ext}"
  target:
    - dmg
  category: public.app-category.music
  extraResources:
    - from: resources/g2-cli
      to: g2-cli

win:
  artifactName: "G2-Editor-Setup.${ext}"
  target:
    - nsis
  extraResources:
    - from: resources/g2-cli.exe
      to: g2-cli.exe

linux:
  target:
    - dir
